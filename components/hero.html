<section class="mainpage sectionViewport" id="mainpage" aria-labelledby="main-title">
    <img src="{{heroImage}}" alt="" class="sectionBackground" fetchpriority="high">
    <div class="heroRow">
        <div class="heroText">
            <h1 class="heroTitle" id="main-title">{{heroTitle}}</h1>
            <p class="heroCopy">{{heroCopy}}</p>
        </div>
        <div class="heroActions">
            <a class="purchaseButton button" href="./purchase.html">구입하기</a>
            <a class="downloadButton button" href="{{heroSecondaryHref}}">{{heroSecondaryLabel}}</a>
        </div>
    </div>
</section>
